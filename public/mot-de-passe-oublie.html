<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Mot de passe oublié</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/app.js" defer></script>
  <script src="/js/password-reset.js" defer></script>
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main class="container">
    <div class="card auth-card stack">
      <h1>Mot de passe oublié</h1>
      <p class="muted">Indiquez l'adresse e-mail de votre compte : nous vous enverrons un lien pour choisir un nouveau mot de passe.</p>
      <form id="forgot-form" class="form">
        <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <div id="alert" class="hidden" role="alert"></div>
        <button class="btn btn-block" type="submit">Envoyer le lien</button>
      </form>
      <p class="center small"><a href="/connexion.html">← Retour à la connexion</a></p>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
