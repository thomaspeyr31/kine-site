<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Connexion</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/app.js" defer></script>
  <script src="/js/auth.js" defer></script>
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main class="container">
    <div class="card auth-card stack">
      <h1>Connexion</h1>
      <p class="muted">Accédez à vos programmes et à vos rendez-vous.</p>
      <form id="login-form" class="form">
        <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="field">
          <div class="spread"><label for="password">Mot de passe</label><a class="small" href="/mot-de-passe-oublie.html">Mot de passe oublié ?</a></div>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div id="alert" class="hidden" role="alert"></div>
        <button class="btn btn-block" type="submit">Se connecter</button>
      </form>
      <div id="demo-accounts" class="alert alert-info small hidden">
        <strong>Comptes de test</strong> (mode développement)
        <div class="demo-row"><span>Kiné : <code>kine@cabinet.fr</code> / <code>MotDePasse123</code></span><button type="button" class="btn btn-ghost btn-sm" data-demo="kine@cabinet.fr|MotDePasse123">Remplir</button></div>
        <div class="demo-row"><span>Patient : <code>patient@test.fr</code> / <code>patient1234</code></span><button type="button" class="btn btn-ghost btn-sm" data-demo="patient@test.fr|patient1234">Remplir</button></div>
      </div>
      <p class="center small">Pas encore de compte ? <a id="to-register" href="/inscription.html">Créer un compte</a></p>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
